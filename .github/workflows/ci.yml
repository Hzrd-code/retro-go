name: Build Retro-Go for M5Launcher

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx      uses: docker/setup-buildx-action@v3

    - name: Build and override target environment
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
        # Vi sender samle-flaget (All-In-One) og target direkte med som build-args:
        build-args: |
          TARGET=t-deck-plus
          CONFIG_RETRO_GO_BUILD_TYPE_ALL_IN_ONE=y

    - name: Extract binaries from docker image
      run: |
        mkdir -p $(pwd)/build
        docker run --rm -v $(pwd)/build:/out retro-go:latest sh -c "find /app -name '*.bin' -exec cp {} /out/ \;"
        ls -la $(pwd)/build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/
